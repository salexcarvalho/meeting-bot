name: "Bug"
description: "Algo não funciona como deveria · Something doesn't work · Algo no funciona"
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        **Não inclua gravações, transcrições, atas nem dados reais de reuniões.** Falha de segurança vai por [SECURITY.md](https://github.com/salexcarvalho/meeting-bot/blob/main/SECURITY.md), não aqui.
        *Do not include recordings, transcripts, minutes or real meeting data. Security issues go through SECURITY.md.*
        *No incluyas grabaciones, transcripciones, actas ni datos reales de reuniones. Fallas de seguridad van por SECURITY.md.*
  - type: textarea
    id: o-que-aconteceu
    attributes:
      label: "O que aconteceu · What happened · Qué pasó"
      description: "E o que você esperava · And what you expected · Y qué esperabas"
    validations:
      required: true
  - type: textarea
    id: como-reproduzir
    attributes:
      label: "Como reproduzir · Steps to reproduce · Cómo reproducir"
      placeholder: "1. …\n2. …\n3. …"
    validations:
      required: true
  - type: input
    id: versao
    attributes:
      label: "Versão · Version · Versión"
      placeholder: "v1.0.0 ou commit · or commit · o commit"
    validations:
      required: true
  - type: dropdown
    id: parte
    attributes:
      label: "Parte do sistema · Area · Parte del sistema"
      options:
        - "Assistente na chamada (Teams/Meet) · In-call assistant · Asistente en la llamada"
        - "Transcrição · Transcription · Transcripción"
        - "Ata / ADR / itens · Minutes / ADR / items · Acta / ADR / ítems"
        - "Agenda / .ics"
        - "host-agent (alertas, captura · alerts, capture · alertas, captura)"
        - "Usuários e permissões · Users and permissions · Usuarios y permisos"
        - "Instalação / Docker · Installation · Instalación"
        - "Outro · Other · Otro"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: "Logs"
      description: "Sem segredos nem conteúdo de reunião · No secrets or meeting content · Sin secretos ni contenido de reuniones"
      render: text
