[project]
name = "host-agent"
version = "1.0.1"
license = "AGPL-3.0-or-later"
description = "Agente nativo do desktop: alertas, abertura de reuniões e captura de áudio (PipeWire)"
requires-python = ">=3.12,<3.13"
dependencies = [
  "httpx>=0.28.1",
  "websockets>=17.1",
]

[project.scripts]
agente-host = "host_agent.main:run"

[dependency-groups]
dev = ["pytest>=8.3", "pytest-asyncio>=1.0"]

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/host_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
