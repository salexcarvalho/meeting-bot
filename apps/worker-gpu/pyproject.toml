[project]
name = "worker-gpu"
version = "1.0.0"
license = "AGPL-3.0-or-later"
description = "ASR (faster-whisper) e diarização (pyannote) locais na GPU para o Agente de Reuniões"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.141.1",
  "uvicorn>=0.53.0",
  "faster-whisper==1.2.1",
  "numpy>=2.0",
  "nvidia-ml-py>=13.610.43",
  # O torch do PyPI usa CUDA 13; o ctranslate2 (faster-whisper) exige CUDA 12 + cuDNN 9.
  # Fixamos torch/torchaudio/torchcodec no índice cu128 para não misturar dois cuDNN.
  "torch==2.11.0",
  "torchaudio==2.11.0",
  "torchcodec==0.11.1",
  "pyannote.audio==4.0.7",
]

[project.scripts]
worker-gpu = "worker_gpu.main:run"

[dependency-groups]
dev = ["pytest>=8.3", "httpx>=0.28.1"]

[tool.uv]
package = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchaudio = { index = "pytorch-cu128" }
torchcodec = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/worker_gpu"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
