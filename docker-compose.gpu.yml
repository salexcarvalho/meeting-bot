# GPU NVIDIA para worker-gpu (precisa do NVIDIA Container Toolkit). O ollama (só embeddings, CPU) não reserva GPU.
# Ative com COMPOSE_FILE=docker-compose.yml:docker-compose.gpu.yml no .env
services:
  worker-gpu:
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
